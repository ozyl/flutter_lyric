# Keep analysis usable on the minimum Dart 2.12 SDK as well as current Flutter.
# Newer SDK-specific lints should not force a higher package SDK minimum.
analyzer:
  language:
    strict-inference: true
    strict-raw-types: true
linter:
  rules:
    - avoid_empty_else
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - curly_braces_in_flow_control_structures
    - hash_and_equals
    - prefer_final_fields
    - unawaited_futures
